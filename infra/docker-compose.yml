services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: saber360
      POSTGRES_PASSWORD: saber360_dev
      POSTGRES_DB: saber360
    ports:
      - "5432:5432"
    volumes:
      - saber360-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saber360 -d saber360"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  saber360-postgres:
